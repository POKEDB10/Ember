# Render Blueprint: one free Docker web service. Secrets are entered in the Render dashboard
# when the Blueprint is first applied (sync: false keeps them out of this file).
services:
  - type: web
    name: ember
    runtime: docker
    plan: free
    # Closest Render region to the UAE (lowest call delay through the relay). Set before the first deploy.
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Lets the server finish uploading pending messages to rootz before it stops.
    maxShutdownDelaySeconds: 120
    envVars:
      - key: ROOTZ_API_KEY
        sync: false
      - key: EMBER_STORAGE_KEY
        sync: false
      - key: ROOTZ_FOLDER_ID
        sync: false
      - key: EMBER_PUBLIC_URL
        sync: false
      - key: EMBER_ARGS
        sync: false
      # Optional: JSON list of STUN/TURN servers for direct calls; empty uses Cloudflare and Google STUN.
      - key: EMBER_ICE_SERVERS
        sync: false
