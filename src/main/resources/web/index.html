<!doctype html>
<html lang="en" data-theme="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember</title>
<meta name="description" content="Ember messenger: say it, spark it, let it fade.">
<meta name="theme-color" content="#120b06">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
<script src="/quality.js" defer></script>
<script src="/e2e.js" defer></script>
<script src="/call.js" defer></script>
</head>
<body>
<main id="login" class="window login" hidden>
  <header class="titlebar"><span>▣ EMBER.EXE</span><span aria-hidden="true">_ □ ×</span></header>
  <form id="loginForm" class="stack">
    <pre class="logo" aria-hidden="true">  ╔═╗╔╦╗╔╗ ╔═╗╦═╗
  ║╣ ║║║╠╩╗║╣ ╠╦╝
  ╚═╝╩ ╩╚═╝╚═╝╩╚═</pre>
    <p class="dim">say it · spark it · let it fade</p>
    <label><span id="userLabel">USERNAME OR EMAIL</span><input id="user" autocomplete="username" required minlength="3" maxlength="254" autocapitalize="none" spellcheck="false"></label>
    <label id="emailRow" hidden>EMAIL<input id="email" type="email" autocomplete="email" maxlength="254"></label>
    <label>PASSWORD<input id="pass" type="password" autocomplete="current-password" required minlength="8"></label>
    <label id="nameRow" hidden>DISPLAY NAME<input id="displayName" autocomplete="nickname" maxlength="40"></label>
    <p id="loginError" class="error" role="alert"></p>
    <button id="loginBtn" type="submit">&gt; LOG IN</button>
    <div class="row between"><button id="modeBtn" type="button" class="link">New here? Create an account</button>
      <button id="forgotBtn" type="button" class="link">Forgot password?</button></div>
  </form>
</main>

<div id="app" hidden>
  <aside class="window side">
    <header class="titlebar">
      <button id="statusBtn" class="title-btn ellipsis" aria-haspopup="menu" title="Set your status"><span id="myDot" class="sdot online" aria-hidden="true"></span> <span id="me">EMBER</span> ▾</button>
      <span class="tools">
        <button id="themeBtn" class="icon" title="Themes" aria-label="Themes" aria-haspopup="menu">◐</button>
        <button id="logoutBtn" class="icon" title="Log out" aria-label="Log out">⏻</button>
      </span></header>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="chats" aria-selected="true">CHATS</button>
      <button role="tab" data-tab="pulse" aria-selected="false">PULSE</button>
      <button role="tab" data-tab="me" aria-selected="false">ME <span id="meBadge" class="badge" hidden></span></button>
    </nav>
    <section id="tab-chats" class="tabpane">
      <div class="row pad"><input id="filter" type="search" placeholder="search chats…" aria-label="Search chats"></div>
      <div class="row pad gap"><button id="newDm">+ DM</button><button id="newGroup">+ GROUP</button></div>
      <ul id="chats" class="list" aria-label="Conversations"></ul>
    </section>
    <section id="tab-pulse" class="tabpane" hidden>
      <div class="row pad gap"><button id="newPost">+ POST</button><button id="newStory">+ STORY</button></div>
      <p class="pad dim small">STORIES · 24 H</p>
      <ul id="stories" class="list" aria-label="Stories"></ul>
    </section>
    <section id="tab-me" class="tabpane me" hidden>
      <div id="meCard" class="mecard"></div>
      <div id="requests"></div>
      <h3 class="sect">ACCOUNT</h3>
      <div class="setlist">
        <button id="emailBtn" class="setrow"><span class="setname">✉ Email<small>sign in and recover your account</small></span><span id="emailVal" class="val">ADD</span></button>
        <button id="unlockBtn" class="setrow" hidden><span class="setname">🔑 Unlock all messages<small>read what your other devices read</small></span><span class="val">OPEN</span></button>
      </div>
      <h3 class="sect">ALERTS</h3>
      <div class="setlist">
        <button id="notifyBtn" class="setrow" role="switch" aria-checked="false"><span class="setname">🔔 Notifications<small id="notifyNote">even when Ember is closed · do not disturb mutes</small></span><span class="sw" aria-hidden="true"></span></button>
      </div>
      <h3 class="sect">CALLS</h3>
      <div class="setlist">
        <button id="hideIpBtn" class="setrow" role="switch" aria-checked="false"><span class="setname">🛡 Hide my IP<small>always use the encrypted relay</small></span><span class="sw" aria-hidden="true"></span></button>
        <label class="setrow"><span class="setname">▦ Video quality<small>auto follows your connection</small></span><select id="qualitySel" aria-label="Call quality"><option value="auto">Auto</option><option value="max">Max</option><option value="datasaver">Data saver</option></select></label>
        <button id="callsV2Btn" class="setrow" role="switch" aria-checked="true"><span class="setname">⚡ Calls v2<small id="callsV2Note">adaptive quality · hand-off · low delay</small></span><span class="sw" aria-hidden="true"></span></button>
      </div>
      <p class="dim tiny pad">Chats and calls are end-to-end encrypted. Calls try a direct link first (lowest delay).</p>
    </section>
    <footer id="status" class="status dim">offline</footer>
  </aside>

  <section class="window chat">
    <header class="titlebar">
      <span class="ellipsis"><button id="back" class="icon back" aria-label="Back">◄</button>
        <button id="chatTitle" class="title-btn">▣ EMBER</button> <span id="chatSub" class="dim"></span></span>
      <span class="tools">
        <button id="callBtn" class="icon" title="Voice call" aria-label="Voice call" hidden>📞</button>
        <button id="videoBtn" class="icon" title="Video call" aria-label="Video call" hidden>🎥</button>
        <button id="starBtn" class="icon" title="Show starred messages" aria-label="Show starred messages" aria-pressed="false" hidden>★</button>
        <button id="searchBtn" class="icon" title="Search this chat" aria-label="Search this chat" hidden>🔍</button>
        <button id="pollBtn" class="icon" title="New poll" aria-label="New poll" hidden>📊</button>
        <button id="addMember" class="icon" title="Add member" aria-label="Add member" hidden>+👤</button>
      </span>
    </header>
    <div id="searchBar" class="row pad" hidden><input id="search" type="search" placeholder="find in chat…" aria-label="Find in chat"></div>
    <button id="pinBar" class="pinbar" hidden></button>
    <div id="polls" class="polls"></div>
    <div id="content" class="content" aria-live="polite"></div>
    <div id="typing" class="typing dim"></div>
    <div id="replyBar" class="replybar" hidden><span id="replyText"></span><button id="replyCancel" class="icon" aria-label="Cancel reply">×</button></div>
    <form id="composer" class="composer" hidden>
      <button id="ttlBtn" type="button" class="icon" title="Disappear after 15 s" aria-pressed="false">⏱</button>
      <textarea id="input" rows="1" placeholder="type a message_" aria-label="Message"></textarea>
      <button id="sendBtn" type="submit">SEND</button>
    </form>
  </section>
</div>
<div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Picture and video viewer">
  <figure><img id="overlayImg" alt=""><video id="overlayVid" controls playsinline hidden></video><figcaption id="overlayCap"></figcaption></figure>
  <button id="overlayDel" class="danger overlaydel" hidden>DELETE STORY</button>
  <button id="overlayClose" class="icon" aria-label="Close">×</button>
</div>
<section id="callBox" class="window callbox" hidden role="dialog" aria-label="Call">
  <header class="titlebar"><span id="callTitle" class="ellipsis">▣ CALL</span><span class="tools"><span id="callInfo" class="dim"></span>
    <button id="callFull" class="icon" title="Full screen" aria-label="Full screen" aria-pressed="false">⛶</button></span></header>
  <div id="callStage" class="callstage">
    <div id="callTiles" class="tiles"></div>
    <video id="callLocal" class="selfview" autoplay playsinline muted></video>
  </div>
  <p id="callStatus" class="callstatus" aria-live="polite"></p>
  <div id="callCode" class="small dim callcode"></div>
  <div id="callStats" class="small callstats" hidden aria-live="off"></div>
  <button id="callStatsSave" class="link small" hidden>save stats log</button>
  <div class="row gap wrap pad">
    <button id="callAccept" hidden>ACCEPT</button>
    <button id="callMic" aria-label="Microphone">MIC ON</button>
    <button id="callCam" aria-label="Camera" hidden>CAM ON</button>
    <button id="callHand" aria-label="Raise hand" aria-pressed="false">✋ RAISE</button>
    <button id="callEnd" class="danger">HANG UP</button>
  </div>
</section>
<div id="notices" class="notices" aria-live="polite"></div>
<input id="filePick" type="file" accept="image/png,image/jpeg,image/webp,image/heic,video/mp4,video/webm,video/quicktime" hidden>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
